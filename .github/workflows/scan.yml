name: scan
run-name: ${{ inputs.ticker && format('فحص سهم {0}', inputs.ticker) || 'مسح السوق' }}

on:
  schedule:
    - cron: "37 21 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "رمز سهم لفحصه (مثل ADBE) — اتركه فارغًا لمسح السوق كله"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run scanner
        run: python scan.py
        env:
          TICKER: ${{ inputs.ticker }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "scan $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
